<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
<title id="title">Southern and Eastern Ontario freight coverage</title>
<desc id="desc">Highway 401 runs from Windsor through London, the GTA and Kingston to Cornwall. Highway 403 connects Woodstock, Brantford, Hamilton, Burlington and Mississauga. Highways 416 and 417 connect the eastern corridor with Ottawa and Quebec.</desc>
